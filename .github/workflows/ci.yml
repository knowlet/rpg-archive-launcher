name: Rust core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Official 7-Zip interoperability
        env:
          SEVENZIP_URL: https://github.com/ip7z/7zip/releases/download/26.04/7z2604-linux-x64.tar.xz
          SEVENZIP_SHA256: fc0327ba27e89bd086cf426dff17d77de582953cdbbc10a6576540a06853ffcd
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 30 --max-time 300 -o /tmp/7z2604-linux-x64.tar.xz "$SEVENZIP_URL"
          echo "${SEVENZIP_SHA256}  /tmp/7z2604-linux-x64.tar.xz" | sha256sum -c
          tar -xf /tmp/7z2604-linux-x64.tar.xz -C /tmp 7zz
          chmod +x /tmp/7zz
          python3 scripts/test_7zip_interop.py /tmp/7zz
