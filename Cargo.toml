[package]
name = "rpg-archive-launcher"
version = "0.1.0"
edition = "2024"
description = "Experimental supervised 7z virtual filesystem and NW.js playability probe"
license = "Apache-2.0"

[features]
default = []
fuse = []

[dependencies]
sevenz-rust2 = { version = "=0.24.0", default-features = false, features = ["aes256", "compress"] }
fs2 = "0.4"
libc = "0.2"
sha2 = "0.11"
getrandom = "0.4"
unicode-normalization = "0.1"
serde_json = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
